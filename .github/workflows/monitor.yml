name: Vitrine Radar - monitoramento automatico
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/filtro-sugestoes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - name: Verificar homologacao Cloudflare
        run: curl --fail --show-error --silent --location --max-time 20 --retry 2 'https://vitrine-radar-filter-staging.ainacio1980-financas.workers.dev/api/health'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Testar filtro no navegador real
        run: node tests/staging-browser.mjs
