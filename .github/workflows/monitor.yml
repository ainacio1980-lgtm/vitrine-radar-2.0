name: Vitrine Radar - monitoramento automatico
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: vitrine-radar-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar producao e homologacao sem modificar dados
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://vitrine-radar.ainacio1980-financas.workers.dev/api/health' \
            'https://vitrine-radar-filter-staging.ainacio1980-financas.workers.dev/api/health'; do
            echo "Verificando: $url"
            curl --fail --show-error --silent --location --max-time 20 --retry 2 "$url" > /dev/null
          done
          echo "Ambos os endpoints responderam HTTP 2xx."
