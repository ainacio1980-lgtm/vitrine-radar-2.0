name: Vitrine Radar - verificacao manual
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo da branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnosticar ambiente
        run: |
          node --version
          npm --version
          git rev-parse --short HEAD
          test -f package.json
      - name: Executar verificacoes
        run: npm run verify
