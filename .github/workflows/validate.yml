name: Validate Vitrine Radar
on:
  push:
    branches: [main, fix/filtro-sugestoes]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar disponibilidade real do staging
        run: |
          curl --fail --show-error --silent --location --max-time 20 --retry 2 \
            'https://vitrine-radar-filter-staging.ainacio1980-financas.workers.dev/api/health'

  browser-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Testar clique real na sugestão em homologação
        run: node tests/staging-browser.mjs
