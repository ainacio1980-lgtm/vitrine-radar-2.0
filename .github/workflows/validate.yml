name: Vitrine Radar - validacao de desenvolvimento

on:
  push:
    branches: [main, fix/filtro-sugestoes]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: vitrine-radar-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: fix/filtro-sugestoes
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar estrutura e executar testes
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f src/worker.mjs
          npm run verify
