name: Validate Vitrine Radar
on:
  push:
    branches: [main, fix/filtro-sugestoes]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar disponibilidade real do staging
        run: |
          curl --fail --show-error --silent --location --max-time 20 --retry 2 \
            'https://vitrine-radar-filter-staging.ainacio1980-financas.workers.dev/api/health'

  browser-filter:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.64.1
      - name: Testar clique real na sugestão em homologação
        run: node tests/staging-browser.mjs

  catalog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir cards publicos por pagina
        run: |
          node scripts/check-public-catalog.mjs \
            'https://vitrine-radar.ainacio1980-financas.workers.dev' \
            'https://vitrine-radar-filter-staging.ainacio1980-financas.workers.dev'
