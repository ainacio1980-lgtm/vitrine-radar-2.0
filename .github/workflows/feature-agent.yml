name: Vitrine Radar - desenvolvimento de funcionalidades com testes fixos

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: vitrine-radar-feature-agent
  cancel-in-progress: false

jobs:
  develop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar base e controlador
        run: |
          python3 -m py_compile scripts/agent_propose.py scripts/feature_agent.py
          npm run verify
      - name: Escolher proxima funcionalidade pendente
        id: feature
        shell: bash
        run: |
          set -euo pipefail
          next=$(python3 scripts/feature_agent.py --next)
          if [ "$next" = "none" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Todas as funcionalidades do backlog limitado ja estao implementadas.'
            exit 0
          fi
          IFS='|' read -r task target test_file <<< "$next"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "slug=$task" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "test_file=$test_file" >> "$GITHUB_OUTPUT"
          echo "Proxima funcionalidade com testes fixos: $task"
      - name: Evitar PR duplicada para tarefa em andamento
        if: steps.feature.outputs.available == 'true'
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          open=$(gh pr list --base main --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("agent/feature-"))] | length')
          if [ "$open" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Uma funcionalidade aguarda revisao. Nenhum trabalho duplicado.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Iniciar modelo gratuito local
        if: steps.feature.outputs.available == 'true' && steps.pending.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vr-features -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 ollama/ollama
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 2 'http://127.0.0.1:11434/api/tags' >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 5 'http://127.0.0.1:11434/api/tags' >/dev/null
          docker exec vr-features ollama pull qwen2.5-coder:1.5b
      - name: Implementar funcionalidade e validar teste fixo
        if: steps.feature.outputs.available == 'true' && steps.pending.outputs.skip == 'false'
        id: implementation
        env:
          AI_BACKEND: ollama
          TASK: ${{ steps.feature.outputs.slug }}
          TARGET: ${{ steps.feature.outputs.target }}
          TEST_FILE: ${{ steps.feature.outputs.test_file }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            git restore -- "$TARGET"
            rm -f -- "$TEST_FILE"
            status=0
            python3 scripts/feature_agent.py --implement "$TASK" || status=$?
            if [ "$status" -eq 10 ]; then
              echo 'proposed=false' >> "$GITHUB_OUTPUT"
              echo 'Modelo recusou a tarefa ou proposta insegura; arquivos preservados.'
              exit 0
            fi
            if [ "$status" -eq 0 ] && npm run verify; then
              echo 'proposed=true' >> "$GITHUB_OUTPUT"
              echo "Funcionalidade $TASK implementada e testes aprovados."
              exit 0
            fi
            echo "::warning::Tentativa $attempt falhou; restaurando arquivos para corrigir."
          done
          git restore -- "$TARGET"
          rm -f -- "$TEST_FILE"
          echo "::error::Funcionalidade nao passou nos testes. Nenhum PR publicado."
          exit 1
      - name: Abrir Pull Request revisavel sem deploy
        if: steps.implementation.outputs.proposed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK: ${{ steps.feature.outputs.slug }}
          TARGET: ${{ steps.feature.outputs.target }}
          TEST_FILE: ${{ steps.feature.outputs.test_file }}
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/feature-${TASK}-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- "$TARGET" "$TEST_FILE"
          git commit -m "feat(agent): implementar $TASK com teste de aceite imutavel"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Funcionalidade autonoma: $TASK" \
            --body "Implementacao pelo Qwen local gratuito com escopo em \`$TARGET\`. Testes de aceite fixos copiados de \`agent_specs/\`, nao editados pela IA. Nao faz deploy nem merge; exige CI e revisao antes da publicacao."
