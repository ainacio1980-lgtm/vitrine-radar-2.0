name: Vitrine Radar - agente experimental de correcoes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: vitrine-radar-agent
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da branch de homologacao
        uses: actions/checkout@v4
        with:
          ref: fix/filtro-sugestoes
          persist-credentials: true
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar base antes da proposta
        run: npm run verify
      - name: Evitar propostas duplicadas
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh pr list --base fix/filtro-sugestoes --state open --json number,title --jq '[.[] | select(.title == "Proposta automatica: robustez do filtro")] | length')
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Existe proposta pendente; nao criar duplicata."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verificar configuracao da IA
        if: steps.pending.outputs.skip == 'false'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::error::AI_API_KEY nao configurada. Configure o segredo do repositorio antes de executar o agente."
            exit 1
          fi
          echo "Credencial de IA presente (valor nao exibido)."
      - name: Propor melhoria isolada via provedor configurado
        id: model
        if: steps.pending.outputs.skip == 'false'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python3 scripts/agent_propose.py
      - name: Registrar indisponibilidade do modelo
        if: failure() && steps.model.outcome == 'failure'
        run: echo "::warning::Provedor de IA nao configurado, indisponivel ou proposta rejeitada; execucao preservada sem alteracao."
      - name: Validar alteracoes
        if: steps.pending.outputs.skip == 'false' && steps.model.outcome == 'success'
        run: npm run verify
      - name: Abrir PR sem publicar
        if: steps.pending.outputs.skip == 'false' && steps.model.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/comparator_search.mjs; then
            echo "Nenhuma alteracao proposta."
            exit 0
          fi
          branch="agent/filtro-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/comparator_search.mjs
          git commit -m "fix: proposta automatica de robustez do filtro"
          git push origin "$branch"
          gh pr create --base fix/filtro-sugestoes --head "$branch" --title "Proposta automatica: robustez do filtro" --body "Gerado pelo agente de IA configurado. Testes npm run verify executados. Revisao obrigatoria. Sem deploy automatico."
